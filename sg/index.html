<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>随机视频播放</title>
    <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNTYiIGhlaWdodD0iMjU2IiB2aWV3Qm94PSIwIDAgMjU2IDI1NiI+PHBhdGggZmlsbD0iY3VycmVudENvbG9yIiBkPSJNNzIgMTQ0SDMyYTggOCAwIDAgMSAwLTE2aDM1LjcybDEzLjYyLTIwLjQ0YTggOCAwIDAgMSAxMy4zMiAwbDI1LjM0IDM4bDkuMzQtMTRhOCA4IDAgMCAxIDYuNjQtMy41Nmg0YTggOCAwIDAgMSAwIDE2aC0xOS43MmwtMTMuNjIgMjAuNDRhOCA4IDAgMCAxLTEzLjMyIDBMODggMTI2LjQybC05LjM0IDE0QTggOCAwIDAgMSA3MiAxNDRNMTc4IDQwYy0yMC42NSAwLTM4LjczIDguODgtNTAgMjMuODlDMTE2LjczIDQ4Ljg4IDk4LjY1IDQwIDc4IDQwYTYyLjA3IDYyLjA3IDAgMCAwLTYyIDYydjIuMjVhOCA4IDAgMCAwIDE2LS41VjEwMmE0Ni4wNiA0Ni4wNiAwIDAgMSA0Ni00NmMxOS40NSAwIDM1Ljc4IDEwLjM2IDQyLjYgMjdhOCA4IDAgMCAwIDE0LjggMGM2LjgyLTE2LjY3IDIzLjE1LTI3IDQyLjYtMjdhNDYuMDYgNDYuMDYgMCAwIDEgNDYgNDZjMCA1My42MS03Ny43NiAxMDIuMTUtOTYgMTEyLjhjLTEwLjgzLTYuMzEtNDIuNjMtMjYtNjYuNjgtNTIuMjFhOCA4IDAgMSAwLTExLjggMTAuODJjMzEuMTcgMzQgNzIuOTMgNTYuNjggNzQuNjkgNTcuNjNhOCA4IDAgMCAwIDcuNTggMEMxMzYuMjEgMjI4LjY2IDI0MCAxNzIgMjQwIDEwMmE2Mi4wNyA2Mi4wNyAwIDAgMC02Mi02MiI+PC9wYXRoPjwvc3ZnPg==" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #000000 0%, #000000 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        .app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            position: relative;
            z-index: 10;
        }
        
        .video-container {
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            background: #000;
            transition: all 0.3s ease;
            width: 100%;
            aspect-ratio: 9/16; /* 手机视频常用比例 */
            max-height: 85vh;
        }
        
        .video-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            position: relative;
            cursor: pointer;
        }
        
        video {
            background: #000;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* 隐藏原生视频控件 */
        .hide-controls::-webkit-media-controls {
            display: none !important;
        }
        
        .hide-controls::-webkit-media-controls-panel {
            display: none !important;
        }
        
        .hide-controls::-webkit-media-controls-play-button {
            display: none !important;
        }
        
        .hide-controls::-webkit-media-controls-start-playback-button {
            display: none !important;
        }
        
        .controls {
            display: flex;
            gap: 16px;
            justify-content: center;
            padding: 8px 0;
        }
        
        button {
            background-color: #05d7f7;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(209, 26, 45, 0.3);
            flex: 1;
            max-width: 180px;
            position: relative;
            z-index: 20;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(209, 26, 45, 0.4);
            background-color: #e62e42;
        }
        
        button:active, button.active-state {
            transform: translateY(1px);
            background-color: #b01525;
            transition: background-color 0.1s ease;
        }
        
        .mute-active {
            background: linear-gradient(to right, #4CAF50, #8BC34A) !important;
        }
        
        .auto-play-active {
            background: linear-gradient(to right, #2196F3, #0b7dda) !important;
        }
        
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 15;
            transition: opacity 0.3s ease;
        }
        
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(209, 26, 45, 0.3);
            border-radius: 50%;
            border-top-color: #d11a2d;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        
        .loading-text {
            font-size: 1.2rem;
            color: #fff;
            letter-spacing: 0.5px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .progress-container {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            z-index: 15;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: #d11a2d;
            transition: width 0.3s ease;
        }
        
        .cache-status {
            display: none;
        }
        
        /* 装饰元素 */
        .bg-decoration {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            filter: blur(80px);
            z-index: 1;
        }
        
        .bg-decoration.top {
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .bg-decoration.bottom {
            bottom: -300px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        /* 响应式调整 */
        @media (max-width: 480px) {
            .app-container {
                gap: 16px;
            }
            
            .video-container {
                border-radius: 16px;
                aspect-ratio: 9/16;
                max-height: 80vh;
            }
            
            .controls {
                gap: 10px;
                padding: 4px 0;
            }
            
            button {
                padding: 12px 16px;
                font-size: 0.9rem;
                max-width: none;
                gap: 6px;
            }
            
            .loading-text {
                font-size: 1rem;
            }
            
            .spinner {
                width: 50px;
                height: 50px;
            }
        }
        
        /* 横屏适配 */
        @media (orientation: landscape) and (max-height: 500px) {
            .app-container {
                flex-direction: row;
                align-items: center;
                max-width: 100%;
                gap: 16px;
            }
            
            .video-container {
                aspect-ratio: 16/9;
                max-height: 90vh;
                flex: 1;
            }
            
            .controls {
                flex-direction: column;
                min-width: 120px;
            }
            
            button {
                max-width: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg-decoration top"></div>
    <div class="bg-decoration bottom"></div>
    
    <div class="app-container">
        <div class="video-container" id="videoContainer">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <div class="loading-text">加载中...</div>
            </div>
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="cache-status" id="cacheStatus"></div>
            <div class="video-wrapper" id="videoWrapper">
                <video id="videoPlayer" playsinline class="hide-controls"></video>
            </div>
        </div>
        
        <div class="controls">
            <button id="toggleMuteBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                开启静音
            </button>
            <button id="autoPlayBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    <line x1="19" y1="12" x2="12" y2="12"></line>
                </svg>
                自动连播
            </button>
            <button id="reloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 2v6h-6"></path>
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    <path d="M3 22v-6h6"></path>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                </svg>
                下个视频
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const elements = {
                videoPlayer: document.getElementById('videoPlayer'),
                videoContainer: document.getElementById('videoContainer'),
                videoWrapper: document.getElementById('videoWrapper'),
                reloadBtn: document.getElementById('reloadBtn'),
                toggleMuteBtn: document.getElementById('toggleMuteBtn'),
                autoPlayBtn: document.getElementById('autoPlayBtn'),
                loading: document.getElementById('loading'),
                progressContainer: document.getElementById('progressContainer'),
                progressBar: document.getElementById('progressBar'),
                cacheStatus: document.getElementById('cacheStatus')
            };

            const config = {
                AUTO_PLAY_DEFAULT: false,
                MUTE_DEFAULT: false,
                MAX_RETRIES: 5,
                CACHE_SIZE: 15,
                CACHE_THRESHOLD: 3,
                CONTROLS_HIDE_DELAY: 3000,
                API_URLS: [
                    'https://api.yuafeng.cn/API/ly/sgxl.php',
                    'https://api.52vmy.cn/api/video/boy',
                    'https://api.yuafeng.cn/API/ly/sgxl.php'
                ]
            };

            const state = {
                autoPlayEnabled: config.AUTO_PLAY_DEFAULT,
                controlsTimeout: null,
                currentApiIndex: -1,
                retryAttempts: 0,
                retryTimer: null,
                videoCache: [],
                isCaching: false
            };

            const utils = {
                getTimestampUrl(url) {
                    return `${url}?t=${Date.now()}`;
                },
                
                debounce(func, wait) {
                    let timeout;
                    return function(...args) {
                        clearTimeout(timeout);
                        timeout = setTimeout(() => func.apply(this, args), wait);
                    };
                }
            };

            const apiService = {
                getRandomAPI() {
                    let newIndex;
                    do {
                        newIndex = Math.floor(Math.random() * config.API_URLS.length);
                    } while (newIndex === state.currentApiIndex && config.API_URLS.length > 1);
                    
                    state.currentApiIndex = newIndex;
                    return utils.getTimestampUrl(config.API_URLS[newIndex]);
                }
            };

            const cacheManager = {
                shouldCacheMore() {
                    return state.videoCache.length <= config.CACHE_THRESHOLD;
                },
                
                createCacheVideoElement() {
                    const video = document.createElement('video');
                    video.style.display = 'none';
                    video.preload = 'auto';
                    video.muted = true;
                    document.body.appendChild(video);
                    return video;
                },
                
                preloadVideoToCache() {
                    if (state.videoCache.length >= config.CACHE_SIZE || state.isCaching || !this.shouldCacheMore()) {
                        return;
                    }
                    
                    state.isCaching = true;
                    const videoUrl = apiService.getRandomAPI();
                    const videoElement = this.createCacheVideoElement();
                    
                    const cleanup = () => {
                        if (videoElement && videoElement.parentNode) {
                            document.body.removeChild(videoElement);
                        }
                        state.isCaching = false;
                    };
                    
                    videoElement.src = videoUrl;
                    
                    const loadedHandler = () => {
                        state.videoCache.push({ url: videoUrl, element: videoElement });
                        state.isCaching = false;
                        
                        if (this.shouldCacheMore()) {
                            setTimeout(() => this.preloadVideoToCache(), 500);
                        }
                        videoElement.removeEventListener('loadeddata', loadedHandler);
                    };
                    
                    const errorHandler = () => {
                        cleanup();
                        setTimeout(() => this.preloadVideoToCache(), 1000);
                        videoElement.removeEventListener('error', errorHandler);
                    };
                    
                    videoElement.addEventListener('loadeddata', loadedHandler);
                    videoElement.addEventListener('error', errorHandler);
                },
                
                getVideoFromCache() {
                    if (state.videoCache.length === 0) return null;
                    
                    const cachedVideo = state.videoCache.shift();
                    
                    if (this.shouldCacheMore()) {
                        setTimeout(() => this.preloadVideoToCache(), 100);
                    }
                    
                    return cachedVideo;
                }
            };

            const videoController = {
                resizeVideoContainer() {
                    if (!elements.videoPlayer.videoWidth || !elements.videoPlayer.videoHeight) return;
                    
                    const aspectRatio = elements.videoPlayer.videoWidth / elements.videoPlayer.videoHeight;
                    const containerWidth = elements.videoContainer.offsetWidth;
                    const containerHeight = elements.videoContainer.offsetHeight;
                    const containerAspectRatio = containerWidth / containerHeight;
                    
                    let width, height;
                    
                    if (aspectRatio > containerAspectRatio) {
                        width = containerWidth;
                        height = width / aspectRatio;
                    } else {
                        height = containerHeight;
                        width = height * aspectRatio;
                    }
                    
                    elements.videoPlayer.style.width = `${width}px`;
                    elements.videoPlayer.style.height = `${height}px`;
                },
                
                clearRetryTimer() {
                    if (state.retryTimer) {
                        clearTimeout(state.retryTimer);
                        state.retryTimer = null;
                    }
                },
                
                showLoading() {
                    elements.loading.style.display = 'flex';
                    elements.videoPlayer.style.display = 'none';
                },
                
                hideLoading() {
                    elements.loading.style.display = 'none';
                    elements.videoPlayer.style.display = 'block';
                },
                
                hideControls() {
                    elements.videoPlayer.classList.add('hide-controls');
                },
                
                showControls() {
                    clearTimeout(state.controlsTimeout);
                    elements.videoPlayer.classList.remove('hide-controls');
                    
                    state.controlsTimeout = setTimeout(() => this.hideControls(), config.CONTROLS_HIDE_DELAY);
                },
                
                cleanupVideoResources() {
                    elements.videoPlayer.pause();
                    elements.videoPlayer.src = '';
                    elements.videoPlayer.load();
                },
                
                loadVideoFromCache() {
                    const cachedVideo = cacheManager.getVideoFromCache();
                    
                    if (cachedVideo) {
                        this.cleanupVideoResources();
                        
                        elements.videoPlayer.src = cachedVideo.url;
                        
                        if (cachedVideo.element && cachedVideo.element.parentNode) {
                            document.body.removeChild(cachedVideo.element);
                        }
                        
                        const loadedMetadataHandler = () => {
                            this.resizeVideoContainer();
                            elements.videoPlayer.play().catch(e => console.error('播放错误:', e));
                            elements.videoPlayer.removeEventListener('loadedmetadata', loadedMetadataHandler);
                        };
                        
                        const errorHandler = () => {
                            this.loadVideoDirect();
                            elements.videoPlayer.removeEventListener('error', errorHandler);
                        };
                        
                        elements.videoPlayer.addEventListener('loadedmetadata', loadedMetadataHandler);
                        elements.videoPlayer.addEventListener('error', errorHandler);
                    } else {
                        this.loadVideoDirect();
                    }
                },
                
                loadVideoDirect() {
                    this.clearRetryTimer();
                    
                    this.cleanupVideoResources();
                    
                    this.showLoading();
                    
                    const selectedAPI = apiService.getRandomAPI();
                    
                    elements.videoPlayer.src = selectedAPI;
                    
                    elements.videoPlayer.loop = !state.autoPlayEnabled;
                    
                    const loadedMetadataHandler = () => {
                        this.resizeVideoContainer();
                        elements.videoPlayer.play().catch(e => console.error('播放错误:', e));
                        this.hideLoading();
                        elements.videoPlayer.removeEventListener('loadedmetadata', loadedMetadataHandler);
                    };
                    
                    elements.videoPlayer.addEventListener('loadedmetadata', loadedMetadataHandler);
                },
                
                handleVideoError() {
                    state.retryAttempts++;
                    
                    if (state.retryAttempts <= config.MAX_RETRIES) {
                        state.retryTimer = setTimeout(() => {
                            this.loadVideoFromCache();
                        }, 1000);
                    } else {
                        state.retryAttempts = 0;
                        this.loadVideoFromCache();
                    }
                }
            };

            const eventHandlers = {
                addButtonFeedback(button) {
                    button.classList.add('active-state');
                    setTimeout(() => {
                        button.classList.remove('active-state');
                    }, 200);
                },
                
                addTouchListeners() {
                    const buttons = document.querySelectorAll('button');
                    
                    buttons.forEach(button => {
                        button.addEventListener('touchstart', function(e) {
                            e.stopPropagation();
                            this.classList.add('active-state');
                        }, { passive: true });
                        
                        button.addEventListener('touchend', function(e) {
                            e.stopPropagation();
                            e.preventDefault();
                            this.classList.remove('active-state');
                            this.click();
                        }, { passive: false });
                        
                        button.addEventListener('touchcancel', function() {
                            this.classList.remove('active-state');
                        });
                    });
                },
                
                bindEvents() {
                    elements.videoPlayer.addEventListener('loadedmetadata', () => {
                        videoController.resizeVideoContainer();
                        videoController.hideLoading();
                        state.retryAttempts = 0;
                        
                        elements.videoPlayer.play().catch(e => {
                            console.error('自动播放失败:', e);
                        });
                    });
                    
                    elements.videoPlayer.addEventListener('play', () => {
                        videoController.hideControls();
                    });
                    
                    elements.videoPlayer.addEventListener('pause', () => {
                        videoController.showControls();
                    });
                    
                    elements.videoPlayer.addEventListener('ended', () => {
                        if (state.autoPlayEnabled) {
                            videoController.loadVideoFromCache();
                        } else {
                            videoController.showControls();
                        }
                    });
                    
                    elements.videoWrapper.addEventListener('click', () => {
                        if (elements.videoPlayer.paused) {
                            elements.videoPlayer.play();
                        } else {
                            elements.videoPlayer.pause();
                        }
                        videoController.showControls();
                    });
                    
                    elements.videoWrapper.addEventListener('mousemove', () => {
                        if (!elements.videoPlayer.paused) {
                            videoController.showControls();
                        }
                    });
                    
                    elements.reloadBtn.addEventListener('click', () => {
                        this.addButtonFeedback(elements.reloadBtn);
                        videoController.loadVideoFromCache();
                    });
                    
                    elements.autoPlayBtn.addEventListener('click', () => {
                        this.addButtonFeedback(elements.autoPlayBtn);
                        state.autoPlayEnabled = !state.autoPlayEnabled;
                        elements.autoPlayBtn.textContent = state.autoPlayEnabled ? '关闭连播' : '自动连播';
                        
                        if (state.autoPlayEnabled) {
                            elements.autoPlayBtn.classList.add('auto-play-active');
                        } else {
                            elements.autoPlayBtn.classList.remove('auto-play-active');
                        }
                        
                        elements.videoPlayer.loop = !state.autoPlayEnabled;
                    });
                    
                    elements.toggleMuteBtn.addEventListener('click', () => {
                        this.addButtonFeedback(elements.toggleMuteBtn);
                        elements.videoPlayer.muted = !elements.videoPlayer.muted;
                        elements.toggleMuteBtn.textContent = elements.videoPlayer.muted ? '取消静音' : '开启静音';
                        
                        if (elements.videoPlayer.muted) {
                            elements.toggleMuteBtn.classList.add('mute-active');
                        } else {
                            elements.toggleMuteBtn.classList.remove('mute-active');
                        }
                    });
                    
                    elements.videoPlayer.addEventListener('error', () => {
                        videoController.handleVideoError();
                    });
                    
                    window.addEventListener('resize', utils.debounce(() => {
                        videoController.resizeVideoContainer();
                    }, 100));

                    if ('ontouchstart' in window) {
                        const buttons = document.querySelectorAll('button');
                        buttons.forEach(btn => {
                            btn.addEventListener('touchstart', function() {
                                this.style.opacity = '0.8';
                            });
                            
                            btn.addEventListener('touchend', function() {
                                this.style.opacity = '1';
                            });
                        });
                    }
                }
            };

            function init() {
                elements.videoPlayer.controls = true;
                elements.videoPlayer.setAttribute('controlslist', 'nodownload noremoteplayback noplaybackrate');
                
                // 初始化按钮状态
                elements.autoPlayBtn.textContent = state.autoPlayEnabled ? '关闭连播' : '自动连播';
                if (state.autoPlayEnabled) {
                    elements.autoPlayBtn.classList.add('auto-play-active');
                }
                
                elements.videoPlayer.muted = config.MUTE_DEFAULT;
                elements.toggleMuteBtn.textContent = elements.videoPlayer.muted ? '取消静音' : '开启静音';
                if (elements.videoPlayer.muted) {
                    elements.toggleMuteBtn.classList.add('mute-active');
                }
                
                videoController.loadVideoFromCache();
                
                // 预加载缓存
                for (let i = 0; i < config.CACHE_SIZE; i++) {
                    setTimeout(() => cacheManager.preloadVideoToCache(), i * 300);
                }
                
                eventHandlers.bindEvents();
                
                setTimeout(() => videoController.hideControls(), 100);
            }

            init();
        });
    </script>
</body>
</html>
